apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-service-account
  namespace: mlops
  annotations:
    # AWS IAM Role for Service Accounts (IRSA)
    # Allows pods to securely interact with AWS S3 & CloudWatch without static credentials
    eks.amazonaws.com/role-arn: "arn:aws:iam::843012953573:role/MLOpsEC2Role"

