apiVersion: v1
kind: Service
metadata:
  name: mlops-serving-service
  namespace: mlops
  labels:
    app: fraud-detector
spec:
  # NodePort allows direct access on EC2 port 30080
  # Change to LoadBalancer if running on AWS EKS with an ALB/CLB
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: fraud-detector

